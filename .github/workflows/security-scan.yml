name: Security Scan (Bandit SAST)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bandit-sast:
    name: Run Bandit static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit scan
        run: bandit -r . -f screen --severity-level medium
